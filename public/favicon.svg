<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131829"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DA9FF"/>
      <stop offset="100%" stop-color="#8B6DFF"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Grid lines subtis -->
  <line x1="96" y1="340" x2="416" y2="340" stroke="#5DA9FF" stroke-width="1.5" opacity="0.12"/>
  <line x1="96" y1="270" x2="416" y2="270" stroke="#5DA9FF" stroke-width="1.5" opacity="0.12"/>
  <line x1="96" y1="200" x2="416" y2="200" stroke="#5DA9FF" stroke-width="1.5" opacity="0.12"/>

  <!-- Área sob a curva -->
  <path d="M100 370 L175 310 L230 278 L295 230 L360 175 L410 130 L410 385 L100 385 Z"
        fill="url(#grad)" opacity="0.15" clip-path="url(#clip)"/>

  <!-- Linha do gráfico -->
  <polyline points="100,370 175,310 230,278 295,230 360,175 410,130"
            fill="none" stroke="url(#grad)" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"
            clip-path="url(#clip)"/>

  <!-- Ponto final -->
  <circle cx="410" cy="130" r="22" fill="#8B6DFF"/>
  <circle cx="410" cy="130" r="36" fill="#8B6DFF" opacity="0.2"/>

  <!-- Eixo X -->
  <line x1="96" y1="385" x2="416" y2="385" stroke="#5DA9FF" stroke-width="2" opacity="0.25"/>
</svg>
