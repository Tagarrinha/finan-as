<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0D14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fintrack" />
    <!-- Icons (Apple) -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- SEO / Social -->
    <meta name="description" content="Controla despesas, rendimentos e patrimônio líquido. App de finanças pessoais com modo casal, metas de poupança e relatórios mensais." />
    <meta property="og:title" content="MyOwnFintrack — App de Finanças Pessoais" />
    <meta property="og:description" content="Controla despesas, rendimentos e patrimônio líquido. App de finanças pessoais com modo casal, metas de poupança e relatórios mensais." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.myownfintrack.app/og-image.png" />
    <meta property="og:url" content="https://www.myownfintrack.app" />
    <title>MyOwnFintrack — App de Finanças Pessoais</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW error:', err));
        });
      }
    </script>
  </body>
</html>
